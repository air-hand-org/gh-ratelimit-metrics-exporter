name: setup tools
description: Set up project tools with aqua and mise.

inputs:
  aqua:
    description: Install aqua-managed tools.
    default: "true"
runs:
  using: composite
  steps:
    - if: ${{ inputs.aqua == 'true' }}
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.66.0
        aqua_opts: ""
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        cache: false
